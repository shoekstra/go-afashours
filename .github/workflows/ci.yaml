---
name: CI

on:
  pull_request:

jobs:
  fmtcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@master
      - name: Setup Go env
        uses: actions/setup-go@v2
        with:
          go-version: "1.15.6"
      - name: Run fmtcheck
        run: make fmtcheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@master
      - name: Setup Go env
        uses: actions/setup-go@v2
        with:
          go-version: "1.15.6"
      - name: Run tests
        run: make test
    env:
      AFAS_ACCOUNT: ${{ secrets.AFAS_ACCOUNT }}
      AFAS_TOKEN: ${{ secrets.AFAS_TOKEN }}
      EMPLOYEE_ID: ${{ secrets.EMPLOYEE_ID }}
